services:
  - type: web
    name: nucleus-api
    runtime: node
    buildCommand: npm ci --workspace @edu/shared --include=dev && npm run build -w @edu/shared && npm run build -w @edu/api
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w @edu/api
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUSH_PROVIDER
        value: expo
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 900
      - key: REFRESH_TOKEN_TTL
        value: 604800
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAILER_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: EMAIL_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: ESEWA_ENABLED
        value: false
      - key: ESEWA_MERCHANT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: ESEWA_FORM_URL
        value: https://rc-epay.esewa.com.np/api/epay/main/v2/form
      - key: PAYMENT_CALLBACK_URL
        sync: false
      - key: BACKUP_SCHEDULE
        value: "0 2 * * *"
  - type: cron
    name: nucleus-database-backup
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile.backup
    dockerContext: .
    plan: 0.5c-1g
    schedule: "0 2 * * *"
    envVars:
      - key: BACKUP_DATABASE_URL
        sync: false
      - key: BACKUP_S3_ENDPOINT
        sync: false
      - key: BACKUP_S3_REGION
        value: auto
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        generateValue: true
      - key: BACKUP_ALERT_WEBHOOK_URL
        sync: false
      - key: BACKUP_RETENTION_DAILY
        value: "35"
      - key: BACKUP_RETENTION_MONTHLY
        value: "12"
